<div class="auth-page">
  <div class="auth-card card">
    <div class="auth-header">
      <h1>🛍 EStore</h1>
      <h2>Welcome back</h2>
      <p>Sign in to your account</p>
    </div>

    <div *ngIf="errorMsg" class="alert alert-error">{{ errorMsg }}</div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" [(ngModel)]="credentials.email"
             placeholder="you@example.com" (keyup.enter)="login()" />
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" [(ngModel)]="credentials.password"
             placeholder="••••••••" (keyup.enter)="login()" />
    </div>

    <button class="btn btn-primary full-btn" (click)="login()" [disabled]="loading">
      {{ loading ? 'Signing in...' : 'Sign In' }}
    </button>

    <p class="switch-link">
      Don't have an account? <a routerLink="/register">Register</a>
    </p>

    <div class="demo-credentials">
      <p><strong>Demo accounts:</strong></p>
      <p>user@estore.com / user123</p>
      <p>admin@estore.com / admin123</p>
    </div>
  </div>
</div>
