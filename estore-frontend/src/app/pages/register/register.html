<div class="auth-page">
  <div class="auth-card card">
    <div class="auth-header">
      <h1>🛍 EStore</h1>
      <h2>Create account</h2>
      <p>Join us and start shopping</p>
    </div>

    <div *ngIf="errorMsg" class="alert alert-error">{{ errorMsg }}</div>

    <div class="form-group">
      <label>Full Name</label>
      <input type="text" [(ngModel)]="data.name" placeholder="Your name" />
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" [(ngModel)]="data.email" placeholder="you@example.com" />
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" [(ngModel)]="data.password" placeholder="Min 6 characters" />
    </div>

    <div class="form-group">
      <label>Confirm Password</label>
      <input type="password" [(ngModel)]="data.confirmPassword"
             placeholder="Repeat password" (keyup.enter)="register()" />
    </div>

    <button class="btn btn-primary full-btn" (click)="register()" [disabled]="loading">
      {{ loading ? 'Creating account...' : 'Create Account' }}
    </button>

    <p class="switch-link">
      Already have an account? <a routerLink="/login">Sign in</a>
    </p>
  </div>
</div>
